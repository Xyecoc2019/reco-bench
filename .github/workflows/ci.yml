name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Generate synthetic dataset
        run: python scripts/generate_synthetic_data.py --out data/synthetic_train.parquet

      - name: Run tests
        run: pytest -q

      - name: Smoke run of the benchmark
        run: |
          python -m reco_bench.experiment --data data/synthetic_train.parquet --schemes rich --k 16 --als-iters 2 --cg-iters 4 --bpr-epochs 2 --out results/smoke



























